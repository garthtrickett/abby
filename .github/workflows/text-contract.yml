name: Text contract

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  text-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci
      - run: npm run test:text

  postgres-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate -- down
      - run: npm run db:migrate
      - run: npm run db:generate
      - run: git diff --exit-code -- src/storage/generated
      - run: ABBY_LEDGER=postgres npm run test:postgres
